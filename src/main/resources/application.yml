spring:
  application:
    name: smartbox-delivery-system

  datasource:
    url: jdbc:postgresql://localhost:5432/boxdelivery
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

logging:
  level:
    com.smartboxdeliverysystem: DEBUG

springdoc:
  swagger-ui:
    path: /swagger-ui.html